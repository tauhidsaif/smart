name: Apply bold text styling

on:
  push:
    branches:
      - smart-pages-free-2026-10-20

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'style: make all card information bold-toggleable'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: smart-pages-free-2026-10-20
          fetch-depth: 0

      - name: Patch app.js
        shell: python
        run: |
          from pathlib import Path
          p = Path('cloudflare-pages/app.js')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new)

          replace_once('let addressBold = false;', 'let allTextBold = false;', 'state')

          old = '''boldToggle.addEventListener("click", () => {
  addressBold = !addressBold;
  boldToggle.setAttribute("aria-pressed", String(addressBold));
  boldToggleText.textContent = addressBold ? "Make address normal" : "Make address bold";
  if (generated) {
    setStatus("Formatting preference changed. Generate the card again to apply it.", "info");
  }
});'''
          new = '''boldToggle.addEventListener("click", async () => {
  allTextBold = !allTextBold;
  boldToggle.setAttribute("aria-pressed", String(allTextBold));
  boldToggleText.textContent = allTextBold ? "Make all text normal" : "Make all text bold";

  if (generated && staged) {
    try {
      const frontCanvas = await renderFront(generated.fields, staged.photo, generated.isChild, savedPhotoSettings);
      const backCanvas = await renderBack(
        generated.fields,
        staged.qr,
        generated.isChild,
        allTextBold,
        staged.hindiAddressRaster
      );
      generated = { ...generated, frontCanvas, backCanvas };
      updateGeneratedPreviews();
      setStatus(allTextBold ? "All generated information is now bold." : "All generated information is now normal weight.", "success");
    } catch (error) {
      console.error("Could not apply text weight:", error);
      setStatus(error instanceof Error ? error.message : "Could not apply text weight.", "error");
    }
  }
});'''
          replace_once(old, new, 'bold toggle')
          s = s.replace('addressBold,\n      staged.hindiAddressRaster', 'allTextBold,\n      staged.hindiAddressRaster')
          s = s.replace('addressBold,\n      staged.hindiAddressRaster', 'allTextBold,\n      staged.hindiAddressRaster')
          s = s.replace('addressBold,\n      staged.hindiAddressRaster', 'allTextBold,\n      staged.hindiAddressRaster')
          s = s.replace('addressBold = false', 'allTextBold = false')

          replace_once('async function renderFront(fields, photoImage, isChild, photoSettings = readPhotoSettings()) {', 'async function renderFront(fields, photoImage, isChild, photoSettings = readPhotoSettings()) {', 'renderFront anchor')
          replace_once('ctx.font = \'bold 66pt "NotoSansHindi", "Noto Sans Devanagari", sans-serif\';', 'ctx.font = (allTextBold ? "bold " : "") + \'66pt "NotoSansHindi", "Noto Sans Devanagari", sans-serif\';', 'Hindi name font')
          replace_once('ctx.font = "bold 69pt Arial";', 'ctx.font = (allTextBold ? "bold " : "") + "69pt Arial";', 'English name font')
          replace_once('ctx.font = \'60pt "NotoSansHindi", "Noto Sans Devanagari", sans-serif\';', 'ctx.font = (allTextBold ? "bold " : "") + \'60pt "NotoSansHindi", "Noto Sans Devanagari", sans-serif\';', 'gender font')
          replace_once('ctx.font = "70pt Arial";', 'ctx.font = (allTextBold ? "bold " : "") + "70pt Arial";', 'mobile font')
          replace_once('ctx.font = "bold 130pt Arial";', 'ctx.font = (allTextBold ? "bold " : "") + "130pt Arial";', 'Aadhaar font')
          replace_once('ctx.font = "60pt Arial";', 'ctx.font = (allTextBold ? "bold " : "") + "60pt Arial";', 'VID font')
          replace_once('ctx.font = "bold 40pt sans-serif";', 'ctx.font = (allTextBold ? "bold " : "") + "40pt sans-serif";', 'issue date font')

          replace_once('async function renderBack(fields, qrImage, isChild, addressIsBold = false, hindiAddressRaster = null) {', 'async function renderBack(fields, qrImage, isChild, allTextBold = false, hindiAddressRaster = null) {', 'renderBack signature')
          replace_once('(addressIsBold ? "bold " : "") + \'75pt "NotoSansHindi", "Noto Sans Devanagari", sans-serif\'', '(allTextBold ? "bold " : "") + \'75pt "NotoSansHindi", "Noto Sans Devanagari", sans-serif\'', 'Hindi address fallback font')
          replace_once('(addressIsBold ? "bold " : "") + "62pt Arial"', '(allTextBold ? "bold " : "") + "62pt Arial"', 'English address font')
          replace_once('ctx.font = "bold 40pt sans-serif";', 'ctx.font = (allTextBold ? "bold " : "") + "40pt sans-serif";', 'back details date font')
          replace_once('ctx.font = "bold 130pt Arial";', 'ctx.font = (allTextBold ? "bold " : "") + "130pt Arial";', 'back Aadhaar font')
          replace_once('ctx.font = "60pt Arial";', 'ctx.font = (allTextBold ? "bold " : "") + "60pt Arial";', 'back VID font')

          old_raster = '''    ctx.drawImage(hindiAddressRaster, hindiX, 620, drawWidth, drawHeight);
    ctx.restore();'''
          new_raster = '''    if (allTextBold) {
      const offsets = [[0, 0], [1.4, 0], [0, 1.4], [1.0, 1.0]];
      for (const [dx, dy] of offsets) {
        ctx.drawImage(hindiAddressRaster, hindiX + dx, 620 + dy, drawWidth, drawHeight);
      }
    } else {
      ctx.drawImage(hindiAddressRaster, hindiX, 620, drawWidth, drawHeight);
    }
    ctx.restore();'''
          replace_once(old_raster, new_raster, 'Hindi raster bolding')

          p.write_text(s, encoding='utf-8')

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check cloudflare-pages/app.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-pages/app.js
          git diff --cached --quiet && { echo "No changes needed"; exit 0; }
          git commit -m "style: make all card information bold-toggleable"
          git push origin HEAD:smart-pages-free-2026-10-20

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/apply-bold-text-style.yml
          git commit -m "chore: remove temporary bold-style patch workflow"
          git push origin HEAD:smart-pages-free-2026-10-20
